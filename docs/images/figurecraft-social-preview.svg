    <text x="273" y="310" fill="#4338CA" font-family="Georgia, Times New Roman, serif" font-size="75" font-weight="700" font-style="italic" letter-spacing="-4">Craft</text>
    <text x="76" y="362" fill="#334155" font-size="27" font-weight="650">From one prompt to a figure you can trust.</text>
