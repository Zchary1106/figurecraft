<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">FigureCraft — publication-quality figures for AI coding agents</title>
  <desc id="desc">Social preview with the FigureCraft identity and examples of a chart, system architecture, and neural-network figure.</desc>
  <defs>
    <linearGradient id="background" x1="80" y1="36" x2="1200" y2="604" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFC"/>
      <stop offset="0.58" stop-color="#EEF2FF"/>
      <stop offset="1" stop-color="#FAE8FF"/>
    </linearGradient>
    <linearGradient id="brandSurface" x1="76" y1="96" x2="248" y2="272" gradientUnits="userSpaceOnUse">
      <stop stop-color="#172554"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="brandCurve" x1="106" y1="229" x2="216" y2="134" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="0.52" stop-color="#818CF8"/>
