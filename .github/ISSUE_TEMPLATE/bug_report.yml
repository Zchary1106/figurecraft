name: Bug report
description: Report an installation, validation, rendering, export, or output problem.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a FigureCraft problem. Please remove private code,
        credentials, and proprietary data before attaching inputs or manifests.
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Installation or runtime setup
        - FigureSpec validation
        - Scientific chart rendering
        - Technical diagram rendering
        - Draw.io export
        - PNG or PDF export
        - Typography or missing glyphs
        - Agent skill routing
        - Other
    validations:
      required: true
  - type: dropdown
    id: host
    attributes:
      label: Agent host
      options:
        - OpenAI Codex
        - Claude Code
        - GitHub Copilot
        - Direct CLI usage
        - Not applicable
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Python version, and relevant optional dependencies.
      placeholder: macOS 15, Python 3.12, Cairo installed with Homebrew
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Include the exact command or agent request and the smallest safe input that reproduces the issue.
      placeholder: |
        1. Run ...
        2. Render ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the full error and relevant manifest checks when available.
    validations:
      required: true
  - type: textarea
    id: artifacts
    attributes:
      label: Safe artifacts
      description: Drag in a redacted FigureSpec, SVG/PNG preview, or figure-manifest.json if it is safe to share.
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I removed secrets, private source code, and proprietary data.
          required: true
