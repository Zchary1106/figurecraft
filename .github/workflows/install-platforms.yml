name: Cross-platform installation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies for installer regression tests
        run: python -m pip install ".[export]"
      - name: Run installer and bootstrap regressions
        run: python -m unittest discover -s tests -p test_install_runtime.py -v
      - name: Install all hosts on macOS
        if: runner.os == 'macOS'
        env:
          FIGURECRAFT_PYTHON: python
        run: bash ./install.sh --scope project --project "$RUNNER_TEMP/FigureCraft install"
      - name: Install all hosts on Windows
        if: runner.os == 'Windows'
        shell: powershell
        env:
          FIGURECRAFT_PYTHON: python
        run: '& .\install.ps1 --scope project --project "$env:RUNNER_TEMP\FigureCraft install"'
      - name: Render through each installed host
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          root = Path(os.environ["RUNNER_TEMP"]) / "FigureCraft install"
          for host in (".claude", ".github", ".agents"):
              core = root / host / "skills/figurecraft"
              output = root / f"output-{host[1:]}"
              subprocess.run([
                  sys.executable, str(core / "scripts/figure.py"), "render",
                  str(core / "assets/examples/agent-evidence-workflow.json"),
                  "--output", str(output),
              ], check=True)
              manifest = json.loads((output / "figure-manifest.json").read_text())
              assert manifest["skill"]["name"] == "figurecraft"
              assert manifest["checks"]["passed"]
